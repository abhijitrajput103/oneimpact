  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

hat elevates your SEO.\"],\n        [\"Enterprise SEO services\", \"Have a large website or multiple locations? We create strategies tailored to large-scale businesses, including internal linking, crawl optimization, global content management, and collaboration across teams.\"],\n        [\"Penalty recovery services\", \"If Google hit your site with a penalty, we find the cause, clean it up, and future-proof your website with compliant white-hat strategies that align with algorithm guidelines.\"]\n      ] },\n      { label: \"Platform-based SEO\", items: [\n        [\"E-commerce SEO\", \"Get more visibility and sales from your eCommerce store with targeted optimization. We enhance your technical SEO, structure your site for shoppers, and build content that converts.\"],\n        [\"Local SEO\", \"Want to get discovered in your area? Our local SEO solutions help you appear in map results, “near me” searches, and local directories, perfect for businesses with a physical presence.\"],\n        [\"Amazon SEO\", \"We optimize your Amazon listings using relevant keywords, compelling descriptions, and performance-focused enhancements that boost your product rankings and sales.\"],\n        [\"YouTube SEO\", \"Struggling to grow your YouTube presence? Our SEO strategies help your videos get found with optimized titles, tags, descriptions, watch-time improvements, and thumbnails that drive clicks.\"],\n        [\"WordPress SEO\", \"We optimize WordPress websites with better structure, schema, content enhancements, and site speed improvements to help you rank and retain traffic.\"],\n        [\"Shopify SEO\", \"From product titles to meta tags and site architecture, our Shopify SEO experts ensure your store is optimized to attract and convert organic traffic.\"]\n      ] }\n    ];\n    var svcs = alt(svcGroups[s.svc].items.map(function (x) { return { t: x[0], a: x[1] }; }));\n    var why2 = alt([\n      { t: \"SEO strategies tailored to you\", a: \"We don’t do cookie-cutter. Every SEO campaign we craft is built around your specific business goals, industry needs, and target audience.\" },\n      { t: \"Up-to-the-minute algorithm know-how\", a: \"Our experts stay current with every Google algorithm shift, so your SEO strategy is always optimized for what search engines want right now.\" },\n      { t: \"Cross-industry experience\", a: \"From startups to global brands, our team brings a wide range of insights to every campaign, helping us tackle SEO from multiple perspectives.\" },\n      { t: \"Analytics-driven execution\", a: \"We base every decision on real-time data, not guesswork. That means higher efficiency, smarter strategy, and measurable outcomes.\" },\n      { t: \"Success with competitive keywords\", a: \"We help businesses rank for some of the toughest keywords in their niche, and we’ll do the same for you.\" },\n      { t: \"Scalable for growth\", a: \"Whether you’re local or global, our solutions are built to grow alongside your business, with long-term success in mind.\" },\n      { t: \"Ethical, long-term SEO\", a: \"No gimmicks. We use white-hat strategies that build sustainable authority and long-term trust with both users and search engines.\" }\n    ]);\n\n    var L = function (arr) { return \"• \" + arr.join(\"\\n• \"); };\n    var offer = [\n      { label: \"Audit and strategy\", qs: [\n        [\"What is a technical SEO audit?\", \"A technical audit examines the behind-the-scenes setup of your site to identify any issues that might block search engines or affect user experience. We look at:\\n\" + L([\"Crawl errors and indexing status\", \"Site load speed and performance\", \"Mobile usability and responsiveness\", \"HTTPS setup and security layers\", \"URL structures and navigation paths\", \"Duplicate content cleanups\", \"Meta and HTML tag accuracy\", \"Redirect chains and broken links\", \"Analytics and tracking health\", \"Compliance with Core Web Vitals\"])],\n        [\"What does an on-page SEO audit cover?\", \"This audit evaluates how well each individual page is optimized for both search engines and visitors. It includes:\\n\" + L([\"Title tags and meta descriptions\", \"Heading tag hierarchy and structure\", \"Internal and outbound linking patterns\", \"Content depth, clarity, and keyword placement\", \"Technical checks like page load speed, schema markup, mobile optimization, canonical tags, and image SEO\"])],\n        [\"What is an off-page SEO audit?\", \"Off-page audits help measure your brand’s authority across the web. We examine:\\n\" + L([\"Strength and quality of your backlink profile\", \"Your domain and page authority scores\", \"Outreach, guest post, and link-building effectiveness\", \"Online presence and community engagement\", \"Any penalties or spammy link risks\"])],\n        [\"How does competitor analysis help with SEO?\", \"It provides a benchmark for your own strategy. With competitive insights, we:\\n\" + L([\"Pinpoint which keywords are bringing your rivals traffic\", \"Find content opportunities they’ve missed\", \"Analyze their backlink and content tactics\", \"Build smarter strategies that help you overtake them\"])],\n        [\"How are high-intent keywords discovered?\", \"We categorize search terms based on user intent: whether they’re ready to buy (transactional), researching (informational), or looking for a brand (navigational). Using advanced tools like SEMrush and Ahrefs, we:\\n\" + L([\"Identify valuable keywords with high conversion potential\", \"Align them with what your customers are looking for\", \"Analyze which terms are bringing in traffic for top competitors\"])]\n      ] },\n      { label: \"Technical SEO\", qs: [\n        [\"How can website speed be improved for SEO?\", \"Improving page load times starts with identifying bottlenecks. We optimize and compress images, reduce server response times, and minify CSS and JavaScript files. Enabling browser caching and using a content delivery network (CDN) ensures assets load quickly from the closest server to your visitor. Together, these changes make pages feel instant.\"],\n        [\"What is mobile SEO optimization?\", \"Mobile optimization is all about delivering a smooth experience on smartphones and tablets. We use responsive design to adapt layouts to different screens, streamline page elements to reduce load times, and ensure navigation and buttons are finger-friendly. Eliminating intrusive pop-ups and testing across devices guarantees that mobile visitors stay engaged.\"],\n        [\"How do you improve crawlability and indexability?\", \"Search engines need clear pathways to find and record your content. We tidy up your site’s structure by fixing broken links, removing or consolidating duplicate pages, and organizing navigation into logical categories. A clean, up-to-date XML sitemap and a properly configured robots.txt file guide crawlers to every important page.\"],\n        [\"What are canonical tags, and how do they fix duplicate content?\", \"When similar content appears under multiple URLs, like with tracking parameters, search engines can’t know which version to rank. A canonical tag points to your preferred URL, telling search engines to treat that page as the source. This prevents dilution of ranking signals and keeps your SEO focused on one authoritative address.\"],\n        [\"How does HTTPS impact SEO?\", \"Switching to HTTPS locks down the data exchanged between your site and its visitors. Beyond protecting passwords and payment details, it’s a confirmed ranking signal: Google gives a slight boost to secure sites. We handle SSL certificate installation, update internal links, and resolve any mixed-content issues so the entire site benefits from improved security and trust.\"],\n        [\"How do you manage 404 errors and redirects?\", \"Dead links frustrate users and waste search engine attention. We routinely scan for 404 errors and set up 301 redirects to guide visitors, and link equity, to the most relevant pages. For unavoidable 404s, we craft helpful error pages that suggest alternative content and keep users on your site.\"]\n      ] },\n      { label: \"Content marketing\", qs: [\n        [\"What is an SEO content strategy?\", \"Every successful SEO campaign starts with the right plan. We analyze what your audience is searching for, then outline a series of cornerstone (pillar) pages and supporting cluster articles that guide users through their journey, building authority and driving conversions.\"],\n        [\"How do you optimize blog posts for SEO?\", \"A well-optimized blog post combines useful information with strategic SEO. We weave target keywords naturally into titles, headers, and body text, add relevant internal links, write compelling meta tags, and include descriptive alt text for images, ensuring your content ranks and resonates.\"],\n        [\"What are pillar content and topic clusters in SEO?\", \"Our method builds a central, in-depth pillar page on a key topic, then links out to related, narrower subtopics. This cluster structure improves site navigation, reinforces your expertise on key themes, and signals search engines that you’re a subject-matter leader.\"],\n        [\"How do you identify content gaps for SEO?\", \"By comparing your existing content with competitors and audience search behavior, we pinpoint topics you haven’t covered. We then create targeted content to fill those gaps, capturing new search traffic and preventing your audience from turning to other sources.\"],\n        [\"How can you optimize evergreen content?\", \"Evergreen pages drive consistent traffic over time, but they can grow stale. We routinely revisit high-performing articles to refresh statistics, examples, and keywords, giving your content a fresh boost in visibility and relevance.\"],\n        [\"What is multilingual SEO, and why is it important?\", \"Reaching international audiences requires more than translation. We optimize each language version with local keyword research, correct hreflang tags, and culturally sensitive copy, helping you rank well in multiple regions.\"]\n      ] },\n      { label: \"Link building\", intro: \"Getting other websites to link to yours isn’t just good for SEO, it’s essential. But not all links are created equal. At OneImpact, we stay away from shortcuts. Instead, we take the white-hat route. That means we focus on real, relevant links that actually make sense, through solid content, smart outreach, and meaningful relationships.\", qs: [\n        [\"Our off-page SEO approach\", \"Our off-page SEO approach is simple: we create stuff people want to link to and then help them find it. Take guest blogging, for example. When you contribute something valuable to another site in your field, not only do you reach a new audience, but you also build credibility. And a link back to your site helps search engines see your brand as trustworthy.\"],\n        [\"Broken link building\", \"Broken links happen all the time. Webpages get deleted, moved, or changed, and those old, dead links don’t help anyone. We track down those broken links on relevant sites and offer a helpful piece of content from your site as a replacement. You’re doing the site owner a favor by cleaning up their content, and in return, you gain a quality backlink. It’s practical, smart, and a win on both sides.\"],\n        [\"The skyscraper technique\", \"It sounds fancy, but the idea is straightforward. We look for content that’s doing really well in your space, the stuff that’s getting lots of links, and then we build something even better: more insights, more value, better design. Once it’s ready, we reach out to the folks linking to the original version and suggest they check out your upgraded version instead.\"],\n        [\"Brand mentions and citations\", \"Not every link has to be clickable. Brand mentions and citations, just the name of your business showing up in the right places, also play a part. Even without a link, those mentions tell Google your business is being talked about. That helps with authority and especially with local SEO. Think of it as digital word of mouth.\"],\n        [\"Digital PR and outreach\", \"Digital PR and outreach help you get in front of the right eyes. Whether it’s a niche blog, a media site, or a respected industry outlet, getting featured in the right spots can give your SEO a serious boost. These mentions often come with backlinks, but more importantly, they show search engines (and people) that you’re someone worth paying attention to.\"]\n      ] },\n      { label: \"Local SEO\", qs: [\n        [\"Google Business Profile\", \"Your Google Business Profile is the first stop. If it’s not properly set up, you’re probably missing out on people searching nearby. We make sure the basics are tight: your name, location, phone, and site link. We also upload clear photos, pick the right categories, and keep it fresh with updates and offers. Replying to reviews and writing a keyword-friendly description? We handle those too.\"],\n        [\"NAP consistency\", \"NAP is just Name, Address, Phone, and if those details don’t match across the internet, Google’s trust in your business drops. We comb through all your listings and fix any mismatch. It’s like reputation management, but for search engines.\"],\n        [\"Citations\", \"Citations are spots around the web where your business gets mentioned: local blogs, directories, review sites. The more your business shows up, the more legit you look to search engines. Even if there’s no link, the mention counts.\"],\n        [\"Reviews\", \"Positive, recent reviews show that real people trust you, and search engines love that. We help you encourage happy customers to leave feedback and make sure you’re responding, not with templates, but like a human.\"],\n        [\"Local keywords\", \"Not just any keywords, but the local ones. If someone’s looking for a “marketing agency in Mumbai,” you want to be what shows up, not buried under global results. We work these search terms into your content naturally, across your site and listings, without sounding robotic.\"]\n      ] },\n      { label: \"E-commerce SEO\", qs: [\n        [\"How do you optimize product pages for SEO?\", \"When we work on product pages, we think like the customer. What would they type into Google? What would make them click? We start with titles and descriptions that are actually helpful, not keyword dumps. Every product gets its own voice and answers real questions people might have. Photos are optimized too, with the right tags behind the scenes. We add reviews, FAQs, and related products to keep people exploring the site longer.\"],\n        [\"How do you improve category page SEO?\", \"A bunch of product thumbnails alone won’t cut it. We add a bit of content that explains what the category is about, just enough to give search engines something to work with. Metadata and clean URLs are a must, and we make sure these pages are linked to smartly from other parts of the site, giving the page more weight in Google’s eyes.\"],\n        [\"How do you optimize Amazon and Shopify listings for SEO?\", \"Each platform has its own rules. On Amazon, we craft titles that hit the right keywords but still read like something a real person would want to read. Bullet points are sharp and to the point, and descriptions focus on benefits, not just features. We use strong images, and A+ content where available. On Shopify, we clean up page layouts, weave keywords naturally into the content, and make the whole experience easy to navigate. Blogs help too, and we keep speed and mobile-friendliness tight.\"],\n        [\"What is product schema markup, and how does it help SEO?\", \"Ever seen search results that show price, ratings, or whether something’s in stock? That’s schema at work. It’s a snippet of code we add to the product page that tells search engines what the page is about and the key details. It makes your result stand out on Google, which usually means more clicks.\"],\n        [\"How do you fix duplicate content in e-commerce SEO?\", \"Duplicate content is common in online stores, especially when filters or manufacturer descriptions are involved. We mark the main version of each product page with a canonical tag so Google knows which one to rank. Where possible, we rewrite the content to give it originality. For pages that don’t need to be indexed, we add a noindex tag, so your site avoids confusion and penalties.\"]\n      ] },\n      { label: \"Enterprise SEO\", qs: [\n        [\"What are scalable SEO strategies for large websites?\", \"Scalable SEO for large websites means creating sustainable systems that maintain performance as the site expands. This starts with a well-planned site architecture, allowing search engines to navigate content efficiently. Metadata is handled using templates to maintain consistency, while automated internal linking keeps user experience and SEO signals strong. The process also includes regular technical audits and strategic keyword mapping across page types, helping maintain visibility across thousands of URLs.\"],\n        [\"How do you manage SEO for multiple business locations?\", \"When a business has more than one store or office, we don’t reuse the same content everywhere. Each location gets its own page, written with the words people there actually search for. We make sure your name, phone number, and address are exactly the same wherever they’re listed, manage a Google Business Profile for each location, and build links from nearby sites to help every location get found in its area.\"],\n        [\"How does automation and AI help with SEO?\", \"Some parts of SEO are repetitive, like going through site errors or tracking keywords. AI tools handle that quickly: they scan your site and flag slow pages or trending keywords, which saves us a lot of effort. But we don’t let the tool run wild. We step in, use judgment, and tweak things based on what actually makes sense. Tools help, but people still drive the strategy.\"],\n        [\"What is log file analysis in enterprise SEO?\", \"When Google’s bot visits your site, it leaves information in a log file. We look at it to see which pages it checked, how often it came by, and whether it hit any issues. It’s like reading behind-the-scenes notes. That helps us spot whether your important pages are being seen or ignored, and we adjust so the pages that matter most get crawled more often.\"]\n      ] },\n      { label: \"Voice and AI search\", qs: [\n        [\"How do you optimize for conversational keywords in voice search?\", \"People don’t search the way they talk. They ask “What’s the best SEO service in Mumbai?” instead of typing “SEO service Mumbai.” So we think like that: longer, more natural sentences, and what a person would actually say. We answer those questions in a simple way, clear, short, and direct.\"],\n        [\"What is featured snippet optimization for voice search?\", \"Snippets are the boxes that pop up at the top of Google, and voice assistants love grabbing information from them. We make it easy for Google to pick your answer: clear answers, bullet points, no fluff. A quick, simple answer that gets straight to the point.\"],\n        [\"How do you optimize for voice assistants like Google Assistant, Siri, and Alexa?\", \"We create content that’s clear, conversational, and answers specific questions quickly. By using structured data (schema markup) and focusing on local SEO, we help your content become more accessible to these assistants.\"]\n      ] },\n      { label: \"Video SEO\", qs: [\n        [\"How do you optimize YouTube video titles, descriptions, and tags?\", \"It starts with thinking like a viewer. We look at what someone might actually type in the search bar and shape the title around that. Descriptions stay natural, not overstuffed with keywords, just a quick summary with useful terms. Tags are about variations: different ways people might look for the same thing, so the video has a better shot at showing up.\"],\n        [\"Why are transcripts and captions important for video SEO?\", \"Videos can’t really talk to Google, but text can. Adding captions or transcripts gives Google the words it needs to understand what the video is about, which helps with rankings. It also helps people, like someone who’s on mute or prefers reading along.\"],\n        [\"How does embedding and schema markup improve video visibility?\", \"A video floating on its own doesn’t do much. Placed on a page that fits the topic, people stick around longer and engage with it, which tells Google it’s worth something. Schema is the behind-the-scenes information, like what the video shows and how long it is. It helps search engines understand the content and can lead to rich snippets in search.\"],\n        [\"How do you design thumbnails to improve click-through rates?\", \"A good thumbnail makes you stop scrolling. We use clean images, bold colors where they fit, and a title that hints at what’s inside without overhyping it. It’s not just about views. It’s about making sure the right people click, because they actually care about what the video covers.\"]\n      ] },\n      { label: \"Mobile SEO and ASO\", qs: [\n        [\"How do you test and fix mobile performance for SEO?\", \"We use tools like Google’s Mobile-Friendly Test and PageSpeed Insights to see how your site holds up on phones. They show us what’s off, maybe the page loads slowly, buttons are hard to tap, or the layout breaks. Then we fix the issues one by one: shrinking heavy images, removing extra code, tweaking the server for better speed, or making the design adapt smoothly across screen sizes. Your site should feel smooth and easy to use on any phone.\"],\n        [\"What are Accelerated Mobile Pages (AMP), and why are they important?\", \"AMP is a way to make your pages very fast on mobile. Google is behind it, and the goal is speed. AMP cuts out the bulky stuff so your page loads in a flash. For mobile users, that means less waiting and more scrolling. For you, it means lower bounce rates and better odds of ranking higher in mobile search results.\"],\n        [\"How can App Store Optimization (ASO) improve app rankings?\", \"Getting your app to show up in the App Store or Google Play takes more than uploading it. ASO fine-tunes your app’s name, description, keywords, visuals, and even user reviews. When people search for something similar, your app has a better shot at showing up. More visibility means more downloads, and when the app delivers a good experience, users tend to stick around.\"]\n      ] },\n      { label: \"International SEO\", qs: [\n        [\"How do you implement hreflang tags for multilingual sites?\", \"Imagine running a restaurant in several countries with menus in different languages. How do you make sure customers are handed the right menu? That’s the role of hreflang tags. They’re small markers we add to your pages that tell search engines, “This version is for people in Spain, and this one is for those in Argentina.” Without them, search engines might show someone the wrong page. With hreflang, visitors get the right content in their language, wherever they are.\"],\n        [\"What is geo-targeting, and why is it essential for local SEO?\", \"You’re in your city, looking for a coffee shop, and you don’t want results for cafes in another country. Geo-targeting ensures that when someone searches locally, they see options nearby. For businesses, it means only people in your area find you. We make that happen by keeping your Google Business Profile accurate and consistent and using local terms that make sense to people in your area.\"],\n        [\"How do you choose between ccTLDs, subdomains, and subdirectories for SEO?\", \"Choosing how to organize your website is like deciding how to arrange your bookshelves. Here’s how we approach it:\\n• ccTLDs (like .de or .fr) are best if you want to go all-in on specific countries, but you’ll handle SEO for each site separately, which is more work.\\n• Subdomains (like fr.yoursite.com) help when you need to separate regions or languages, but search engines treat them as different websites, so they need their own SEO efforts.\\n• Subdirectories (like yoursite.com/fr/) are often the easiest to manage. Everything sits under one domain, so you boost the SEO of your whole site, which is more efficient in the long run.\"]\n      ] },\n      { label: \"Analytics and reporting\", qs: [\n        [\"How do you set up Google Analytics and GA4 to track website traffic?\", \"To set up GA4, we start by adding a unique tracking code to your website. From there, we define key events, such as page visits and conversions, and set up specific goals to monitor how visitors use your site. This gives us a clear view of user activity and helps shape your digital strategy.\"],\n        [\"What is Google Search Console used for in SEO?\", \"Google Search Console is a vital tool for understanding how your website performs on Google. It shows us which search terms bring people to your site, alerts us to any crawling or indexing issues, and gives insight into how your pages are displayed in search results.\"],\n        [\"How do you track keyword rankings and performance?\", \"We keep a close eye on how your keywords perform using reliable SEO tracking tools. They show us where your keywords rank, how often they’re clicked, and which pages they drive traffic to. With this information, we refine your SEO strategy to focus on the terms that deliver the best results.\"],\n        [\"How can conversion rate optimization (CRO) improve landing pages?\", \"CRO increases the chances of visitors taking action, like making a purchase or filling out a form, by making landing pages more effective. This involves testing different headlines, layouts, and calls to action to remove friction and make the user journey smoother and more compelling.\"],\n        [\"How do A/B testing and heatmaps help improve user experience?\", \"A/B testing lets us test two versions of a page to see which performs better. Heatmaps show exactly where users click, scroll, or lose interest. These tools help us make data-driven changes that improve usability and keep visitors engaged.\"]\n      ] },\n      { label: \"Competitor analysis\", qs: [\n        [\"How do you identify your competitors in SEO?\", \"We pinpoint your SEO competitors by identifying websites that rank for the same search terms and attract a similar audience. With the help of advanced tools, we uncover both direct competitors and others who compete for search visibility, even if they’re not in the same niche.\"],\n        [\"How can you find high-traffic keywords used by competitors?\", \"By analyzing competitor websites through specialized tools, we identify which keywords bring them the most traffic. This gives us valuable insights and helps uncover fresh keyword opportunities to strengthen your content strategy.\"],\n        [\"What is backlink analysis in SEO?\", \"Backlink analysis involves reviewing the number and quality of external sites linking to yours. We examine your backlink profile, remove any toxic links that could harm your rankings, and look for ways to gain authoritative and relevant links to boost SEO performance.\"],\n        [\"How do you analyze competitor content strategy?\", \"We study the types of content your competitors publish, how frequently they update it, and which pages perform best. This analysis helps us identify what’s missing in your content approach and where you can outshine the competition.\"],\n        [\"How can you study competitor technical SEO and site architecture?\", \"We assess how your competitors organize their sites, from URL structure and mobile optimization to page load speeds and overall user experience. Understanding these factors helps us identify technical strengths you can adopt to improve your own rankings.\"],\n        [\"How does social media affect SEO performance?\", \"While social media signals aren’t a direct ranking factor, they play an important role in generating website traffic, expanding brand reach, and increasing the likelihood of earning quality backlinks, all of which support your SEO success.\"],\n        [\"How do you track SEO performance against competitors?\", \"We monitor and compare key SEO metrics like keyword rankings, traffic patterns, backlink growth, and content effectiveness. These comparisons help us track your progress and refine your strategy to maintain a competitive edge.\"]\n      ] },\n      { label: \"Keyword strategy\", qs: [\n        [\"How do you find high-intent keywords for SEO?\", \"We focus on what people search for when they’re ready to take action, whether that’s making a purchase, scheduling a service, or getting in touch. We look for modifiers like “buy,” “best,” “near me,” or “services,” and validate them using tools such as Google Keyword Planner, along with insights from competitor analysis. This ensures we target terms with strong potential to drive conversions.\"],\n        [\"What are long-tail keywords, and why are they important?\", \"Long-tail keywords are more detailed and specific phrases: think “affordable vegan cafes in Bandra” instead of simply “vegan cafes.” They tend to attract users who are further along in the buying process, face less competition, and usually convert better because their intent aligns closely with the content they find.\"],\n        [\"What is LSI keyword integration in SEO?\", \"LSI (Latent Semantic Indexing) keywords are words and phrases that are contextually connected to your primary keyword. If your main keyword is “digital marketing,” relevant terms might include “online ads,” “SEO strategy,” or “social media campaigns.” We weave these into your content naturally to improve clarity for search engines and enrich the context.\"],\n        [\"How do you find untapped keyword opportunities?\", \"We identify hidden keyword gems by studying competitor gaps, mining data from Google Search Console, and exploring online spaces like forums, Reddit, or industry-specific communities where your target audience spends time. This surfaces valuable search terms that are often overlooked by others.\"],\n        [\"How do you optimize keywords based on search intent?\", \"We align keywords with what users intend to do: researching, comparing, or ready to act. Informational terms are placed in blog articles, while transactional phrases are reserved for product or service pages. This boosts both your search visibility and audience engagement.\"],\n        [\"How can you target seasonal and trend-based keywords?\", \"Using tools like Google Trends and calendars tied to your industry, we spot when interest in certain keywords spikes. We then produce timely, relevant content, such as holiday guides, trend-focused blogs, or seasonal promotions, to capitalize on that demand and drive timely traffic.\"],\n        [\"How do you optimize for question-based keywords in SEO?\", \"We go after question-style keywords like “how to improve SEO” by crafting content that offers direct, helpful answers. This includes FAQ sections, educational blog posts, and formats designed to land in featured snippets or Google’s “People Also Ask” results. It also enhances your visibility in voice search results.\"]\n      ] },\n      { label: \"Internal linking\", qs: [\n        [\"What is strategic internal linking, and why is it important?\", \"Strategic internal linking connects different but related pages within your website using hyperlinks. It helps search engines understand how your site is structured, distributes page authority across your content, and improves user navigation. It guides users toward relevant information, which can improve your key pages’ rankings and lower your bounce rate.\"],\n        [\"How does the topic cluster strategy help with internal linking?\", \"A topic cluster centers on a primary page (the pillar content), supported by multiple related sub-pages (cluster content), all linked to one another. This improves the user’s journey through your content and signals to search engines that your pages are interconnected and relevant, boosting the SEO performance of the entire cluster.\"],\n        [\"How do you fix broken internal links on a website?\", \"Broken internal links hurt both search rankings and user experience. To resolve them:\\n• Use SEO tools like Google Search Console or Screaming Frog to locate the broken links.\\n• If the original page has simply moved, update the URL to the correct location.\\n• If the page no longer exists, create a redirect to a similar or relevant page.\\n• If there’s no valid alternative, remove the link entirely.\"],\n        [\"What are orphan pages, and how do you optimize them?\", \"Orphan pages exist on your website but aren’t linked to from any other page. Since they’re not part of your internal linking structure, search engines may overlook them. We run an SEO audit to find them, then connect them to relevant content with internal links, making them accessible to users and visible to search engines.\"],\n        [\"How can breadcrumb optimization improve SEO?\", \"Breadcrumbs give users a visual trail of where they are on your website, making navigation easier. When optimized, they give search engines a clearer picture of your site’s hierarchy. This improves crawlability and can lead to rich snippets in search results, which often boosts click-through rates.\"],\n        [\"How do you automate internal linking for large websites?\", \"On large websites, managing internal links manually becomes impractical. Automation can streamline the process through:\\n• SEO plugins or CMS features that automatically suggest or add links based on target keywords.\\n• Custom-built tools or scripts that detect linking opportunities across your content.\"]\n      ] },\n      { label: \"Schema markup\", qs: [\n        [\"How do you optimize content for featured snippets?\", \"We focus on the way users ask questions and tailor the content to provide direct, useful answers. This involves clear headers, simple and to-the-point language, and bulleted lists where appropriate. Google tends to feature responses that are easy to understand and well-organized. We also make sure the content is not only relevant but backed by authority.\"],\n        [\"What is schema markup, and how does it help SEO?\", \"Schema markup is structured data added to your website’s code. It helps search engines better grasp what your content is about. With schema, you can make your search listings stand out with rich elements like review stars, FAQs, and event information, features that catch users’ eyes and can drive more clicks.\"],\n        [\"How do you implement JSON-LD for structured data?\", \"JSON-LD is Google’s preferred method for adding structured data. We create customized code based on the content you’re offering, whether it’s a blog post, product listing, or FAQ page, and add it within a script tag on the page, usually in the header or body. This makes the data easy for search engines to process and display properly.\"],\n        [\"How do you test schema markup for correct implementation?\", \"We use tools like Google’s Rich Results Test and the Schema Markup Validator. They check whether your structured data qualifies for enhanced search features and point out any issues or errors that need to be fixed.\"]\n      ] },\n      { label: \"AI-optimized SEO (AIO)\", qs: [\n        [\"How can AI help in content creation for SEO?\", \"Artificial intelligence plays a key role in crafting effective SEO content by studying current search trends, evaluating competitor strategies, and understanding user behavior. It provides suggestions and ideas that match what users are actively looking for, helping us produce highly relevant and visible content.\"],\n        [\"How does AI predict SEO ranking trends?\", \"By processing extensive datasets, AI identifies emerging patterns in keyword usage, shifts in search habits, and algorithm changes. These insights allow us to anticipate which types of content and tactics are likely to gain traction in upcoming search engine updates.\"],\n        [\"How do AI tools automate meta tag and description generation?\", \"AI helps generate precise, keyword-focused meta titles and descriptions by analyzing the content of each page. It pinpoints the most relevant terms and phrases, making the process quicker and ensuring each meta tag supports better visibility and aligns with search intent.\"],\n        [\"How can AI chatbots improve user engagement on a website?\", \"AI-driven chatbots enhance user experience by offering real-time assistance, answering common questions, and guiding visitors through the site at any hour. This continuous support keeps users engaged, encourages longer visits, and contributes positively to the site’s SEO performance.\"],\n        [\"How do you optimize for voice search using AI?\", \"We use AI tools to discover the kinds of questions people ask their voice assistants and identify natural, conversational phrases. Using this information, we develop content that mimics everyday speech and provides clear, direct answers that suit voice-based queries.\"],\n        [\"How does AI improve SEO reporting and insights?\", \"AI simplifies the interpretation of complex SEO data by highlighting which areas are performing well and which need attention. It tracks keyword movement, monitors user behavior, and evaluates content effectiveness, allowing us to refine strategies with real-time, data-backed decisions.\"]\n      ] }\n    ];\n    var cur = offer[s.offer];\n    var faqGroups = [\n      { label: \"Business obstacles\", qs: [\n        [\"Why aren’t we getting enough sales from online channels?\", \"If your site attracts the wrong kind of traffic or doesn’t clearly show value, your sales can suffer. Weak CT h-converting traffic?\", \"We pinpoint keywords that signal buying intent, create landing pages tailored to your ideal customer profiles, and enhance your technical SEO so your highest-value pages perform best. The result is a steady flow of users who are ready to take action.\"],\n        [\"How does OneImpact ensure that my site ranks for the most relevant, high-converting keywords?\", \"Through in-depth keyword research, we focus on search terms that blend strong volume, low competition, and clear user intent. We continually optimize and update content so your site maintains strong positions for keywords that matter most to your bottom line.\"],\n        [\"Why should I trust OneImpact to increase website traffic and sales?\", \"We help brands across industries grow their visibility and revenue through results-driven SEO. Our work is backed by data, built on strategy, and guided by experience, giving you the confidence that every move we make is grounded in real performance goals.\"],\n        [\"What makes OneImpact’s approach to SEO different from other agencies?\", \"Unlike cookie-cutter SEO solutions, our approach combines deep technical know-how with conversion expertise. We don’t just chase rankings. We focus on outcomes that actually move the needle for your business.\"],\n        [\"Why is OneImpact the right choice for improving my brand’s local SEO performance?\", \"Our team specializes in optimizing for local visibility. From fine-tuning your Google Business Profile to building city-specific content and cleaning up citations, we help your business show up when local customers search for services you offer.\"],\n        [\"What strategies does OneImpact use to convert organic traffic into paying customers?\", \"We craft persuasive on-page content, design smooth user journeys, run A/B tests for continuous improvement, and create strong internal links that guide users where you want them to go, turning interest into action and visitors into loyal customers.\"]\n      ] }\n    ];\n    var fg = faqGroups[s.faq];\n    var uspAll = [];\n    uspSets.forEach(function (set) { set.forEach(function (u) { uspAll.push({ head: u[0], text: u[1], d: u[2], chip: uspAll.length % 2 ? \"#D6E5FF\" : \"#FFE7B8\" }); }); });\n    var offerTabs = offer.map(function (o, i) {\n      var on = i === s.offer;\n      return { label: o.label, selected: on ? \"true\" : \"false\", fw: on ? \"600\" : \"500\", bg: on ? \"#FFBA39\" : \"#FFFFFF\", border: on ? \"#000000\" : \"#D2D2D7\", pick: function () { self.setState({ offer: i }); } };\n    });\n    var t = s.touched;\n    var urlOk = /[a-z0-9-]+\\.[a-z]{2,}/i.test(s.url.trim()), nameOk = s.name.trim().length > 0, phoneOk = s.phone.replace(/\\D/g, \"\").length >= 10;\n    var err = \"#FF6B5E\", ok = \"#3A3A3C\";\n    var logos = []; for (var k = 0; k < 16; k++) logos.push(k);\n    var n = Math.max(1, s.nSnaps);\n    return {\n      notices: notices, logos: logos,\n      uspAll: uspAll, setTrack: this.setTrack, carDown: this.carDown, carMove: this.carMove, carUp: this.carUp,\n      prev: function () { self.go(-1); }, next: function () { self.go(1); },\n      prevDis: s.uspIdx <= 0, nextDis: s.uspIdx >= n - 1,\n      progress: n > 1 ? Math.round(((s.uspIdx + 1) / n) * 100) : 100,\n      glint: function (e) { var r = e.currentTarget.getBoundingClientRect(); e.currentTarget.style.setProperty(\"--mx\", (e.clientX - r.left) + \"px\"); e.currentTarget.style.setProperty(\"--my\", (e.clientY - r.top) + \"px\"); e.currentTarget.style.setProperty(\"--gl\", \"1\"); },\n      glintOut: function (e) { e.currentTarget.style.setProperty(\"--gl\", \"0.6\"); e.currentTarget.style.setProperty(\"--mx\", \"70%\"); e.currentTarget.style.setProperty(\"--my\", \"0%\"); },\n      eeat: eeat, quotes: quotes, helps: helps, butWhy: butWhy,\n      svcTabs: this.pills(svcGroups.map(function (g) { return g.label; }), \"svc\"), svcThumb: s.svc * 100, svcs: svcs,\n      why2: why2,\n      offerTabs: offerTabs, offerTitle: cur.label, offerIntro: cur.intro || \"\", offerQs: cur.qs.map(function (x) { return { q: x[0], a: x[1] }; }),\n      mapRows: [\n        { n: \"1\", name: \"Your Business\", meta: \"Open now. Top-rated in your area.\", pin: \"#FFBA39\", bg: \"#FFF4DE\" },\n        { n: \"2\", name: \"Nearby Competitor\", meta: \"Closes soon\", pin: \"#E5E5EA\", bg: \"transparent\" },\n        { n: \"3\", name: \"Another Listing\", meta: \"2.4 km away\", pin: \"#E5E5EA\", bg: \"transparent\" }\n      ],\n      faqTabs: this.pills(faqGroups.map(function (g) { return g.label; }), \"faq\"), faqThumb: s.faq * 100, faqQs: fg.qs.map(function (x) { return { q: x[0], a: x[1] }; }),\n      url: s.url, name: s.name, phone: s.phone, need: s.need,\n      onUrl: function (e) { self.setState({ url: e.target.value }); },\n      onName: function (e) { self.setState({ name: e.target.value }); },\n      onPhone: function (e) { self.setState({ phone: e.target.value }); },\n      onNeed: function (e) { self.setState({ need: e.target.value }); },\n      blurUrl: function () { self.touch(\"url\"); }, blurName: function () { self.touch(\"name\"); }, blurPhone: function () { self.touch(\"phone\"); },\n      showUrlErr: !!t.url && !urlOk, showNameErr: !!t.name && !nameOk, showPhoneErr: !!t.phone && !phoneOk,\n      urlInvalid: t.url && !urlOk ? \"true\" : \"false\", nameInvalid: t.name && !nameOk ? \"true\" : \"false\", phoneInvalid: t.phone && !phoneOk ? \"true\" : \"false\",\n      urlBorder: t.url && !urlOk ? err : ok, nameBorder: t.name && !nameOk ? err : ok, phoneBorder: t.phone && !phoneOk ? err : ok,\n      submit: function () { self.setState({ touched: { url: true, name: true, phone: true } }); if (urlOk && nameOk && phoneOk) self.setState({ sent: true }); },\n      reset: function () { self.setState({ sent: false, url: \"\", name: \"\", phone: \"\", touched: {} }); },\n      sent: s.sent, notSent: !s.sent\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
